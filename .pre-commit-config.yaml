# Pre-commit hook config — runs the seed scanner on staged files.
# Install: `pre-commit install`
# Manual run: `pre-commit run --all-files`

repos:
  - repo: local
    hooks:
      - id: check-no-seeds
        name: Seed/secret scanner
        entry: python3 scripts/check_no_seeds.py
        language: system
        types: [python, markdown, yaml, json, toml, shell]
        pass_filenames: false